info:
  title: OpportunityResponse API
  version: 1.0.0
paths:
  /opportunity:
    get:
      operationId: listOpportunity
      summary: Get all opportunity
      responses:
        '200':
          description: List of opportunity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpportunityResponse'
    post:
      operationId: createOpportunity
      summary: Create a new opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /opportunity/{opportunity_id}:
    get:
      operationId: getOpportunityById
      summary: Get opportunity by opportunity_id
      parameters:
        - in: path
          name: opportunity_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: opportunity object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '404':
          description: opportunity not found
    put:
      operationId: updateOpportunity
      summary: Update opportunity by opportunity_id
      parameters:
        - in: path
          name: opportunity_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '400':
          description: Invalid request
        '404':
          description: opportunity not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteOpportunity
      summary: Delete opportunity by opportunity_id
      parameters:
        - in: path
          name: opportunity_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: opportunity not found
components:
  schemas:

    OpportunityRequest:
      type: object
      required:
        - account_id
        - name
        - application_id
        - currency_code
      additionalProperties: false
      properties:
        opportunity_number:
          type: string
          maxLength: 20
        account_id:
          type: string
          format: uuid
          x-reference:
            table: "crm_account"
            column: "account_id"
        lead_id:
          type: string
          format: uuid
          nullable: true
          x-reference:
            table: "crm_lead"
            column: "lead_id"
        name:
          type: string
        application_id:
          type: string
          format: uuid
          x-reference:
            table: "catalog_application"
            column: "application_id"
        deal_type:
          type: string
          maxLength: 12
          default: "new"
        stage:
          type: string
          maxLength: 15
          default: "prospecting"
        amount:
          type: string
          nullable: true
        currency_code:
          type: string
          x-reference:
            table: "platform_currency"
            column: "currency_code"
        probability:
          type: string
          default: 10
        expected_close_date:
          type: string
          format: date
          nullable: true
        owner_user_id:
          type: string
          format: uuid
          nullable: true
          x-reference:
            table: "iam_app_user"
            column: "app_user_id"
        sales_agent_id:
          type: string
          format: uuid
          nullable: true
          x-reference:
