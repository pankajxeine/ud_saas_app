info:
  title: LeadResponse API
  version: 1.0.0
paths:
  /lead:
    get:
      operationId: listLead
      summary: Get all lead
      responses:
        '200':
          description: List of lead
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadResponse'
    post:
      operationId: createLead
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /lead/{lead_id}:
    get:
      operationId: getLeadById
      summary: Get lead by lead_id
      parameters:
        - in: path
          name: lead_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: lead object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'
        '404':
          description: lead not found
    put:
      operationId: updateLead
      summary: Update lead by lead_id
      parameters:
        - in: path
          name: lead_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'
        '400':
          description: Invalid request
        '404':
          description: lead not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteLead
      summary: Delete lead by lead_id
      parameters:
        - in: path
          name: lead_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: lead not found
