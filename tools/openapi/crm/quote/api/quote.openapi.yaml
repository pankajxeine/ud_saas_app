          type: string
          maxLength: 20
        opportunity_id:
          type: string
          format: uuid
          x-reference:
            table: "crm_opportunity"
            column: "opportunity_id"
        account_id:
          type: string
          format: uuid
          x-reference:
            table: "crm_account"
            column: "account_id"
        price_book_id:
          type: string
          format: uuid
          x-reference:
            table: "commerce_price_book"
            column: "price_book_id"
        status:
          type: string
          maxLength: 16
          default: "draft"
        valid_until:
          type: string
          format: date
        subtotal:
          type: string
          default: 0
        discount_total:
          type: string
          default: 0
        total:
          type: string
          default: 0
        max_discount_percent:
          type: string
          default: 0
        coupon_id:
          type: string
          format: uuid
          nullable: true
          x-reference:
            table: "commerce_coupon"
            column: "coupon_id"
        terms:
          type: string
          nullable: true
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
