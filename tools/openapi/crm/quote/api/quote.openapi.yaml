info:
  title: QuoteResponse API
  version: 1.0.0
paths:
  /quote:
    get:
      operationId: listQuote
      summary: Get all quote
      responses:
        '200':
          description: List of quote
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
    post:
      operationId: createQuote
      summary: Create a new quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /quote/{quote_id}:
    get:
      operationId: getQuoteById
      summary: Get quote by quote_id
      parameters:
        - in: path
          name: quote_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: quote object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '404':
          description: quote not found
    put:
      operationId: updateQuote
      summary: Update quote by quote_id
      parameters:
        - in: path
          name: quote_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid request
        '404':
          description: quote not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteQuote
      summary: Delete quote by quote_id
      parameters:
        - in: path
          name: quote_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: quote not found
components:
  schemas:

    QuoteRequest:
      type: object
      required:
        - opportunity_id
        - account_id
        - price_book_id
        - valid_until
      additionalProperties: false
      properties:
