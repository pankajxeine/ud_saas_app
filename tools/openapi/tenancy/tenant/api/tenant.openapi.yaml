info:
  title: TenantResponse API
  version: 1.0.0
paths:
  /tenant:
    get:
      operationId: listTenant
      summary: Get all tenant
      responses:
        '200':
          description: List of tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantResponse'
    post:
      operationId: createTenant
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /tenant/{tenant_id}:
    get:
      operationId: getTenantById
      summary: Get tenant by tenant_id
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: tenant object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '404':
          description: tenant not found
    put:
      operationId: updateTenant
      summary: Update tenant by tenant_id
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Invalid request
        '404':
          description: tenant not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteTenant
      summary: Delete tenant by tenant_id
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: tenant not found
components:
  schemas:

    TenantRequest:
      type: object
      required:
        - tenant_code
        - customer_account_id
        - legal_name
        - display_name
        - region_code
        - data_residency
        - default_currency_code
      additionalProperties: false
      properties:
        tenant_code:
          type: string
          maxLength: 40
        customer_account_id:
          type: string
          format: uuid
          x-reference:
            table: "crm_account"
            column: "account_id"
        legal_name:
          type: string
        display_name:
          type: string
        status:
          type: string
          default: "draft"
        region_code:
          type: string
          x-reference:
            table: "platform_region"
            column: "region_code"
        data_residency:
          type: string
          x-reference:
            table: "platform_country"
            column: "country_code"
        timezone:
          type: string
          default: "UTC"
        default_locale:
          type: string
          default: "en-US"
        default_currency_code:
          type: string
          x-reference:
            table: "platform_currency"
            column: "currency_code"
        owning_branch_id:
          type: string
          format: uuid
          nullable: true
          x-reference:
            table: "org_branch"
            column: "branch_id"
        sales_agent_id:
          type: string
          format: uuid
          nullable: true
          x-reference:
            table: "partner_sales_agent"
            column: "sales_agent_id"
        is_sandbox:
          type: boolean
          default: false
        parent_tenant_id:
          type: string
          format: uuid
          nullable: true
          x-reference:
            table: "tenancy_tenant"
            column: "tenant_id"
        legal_hold:
          type: boolean
          default: false
        suspended_reason:
          type: string
          nullable: true
          maxLength: 20
        activated_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        purge_after:
          type: string
          format: date
          nullable: true

