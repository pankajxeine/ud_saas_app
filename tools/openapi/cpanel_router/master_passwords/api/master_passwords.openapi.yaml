openapi: 3.0.0
x-sql-table: master_passwords
info:
  title: MasterPasswordsResponse API
  version: 1.0.0
paths:
  /master_passwords:
    get:
      operationId: listMasterPasswords
      summary: Get all master_passwords
      responses:
        '200':
          description: List of master_passwords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterPasswordsResponse'
    post:
      operationId: createMasterPasswords
      summary: Create a new master_passwords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterPasswordsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterPasswordsResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /master_passwords/{master_password_id}:
    get:
      operationId: getMasterPasswordsById
      summary: Get master_passwords by master_password_id
      parameters:
        - in: path
          name: master_password_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: master_passwords object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterPasswordsResponse'
        '404':
          description: master_passwords not found
    put:
      operationId: updateMasterPasswords
      summary: Update master_passwords by master_password_id
      parameters:
        - in: path
          name: master_password_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterPasswordsUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterPasswordsResponse'
        '400':
          description: Invalid request
        '404':
          description: master_passwords not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMasterPasswords
      summary: Delete master_passwords by master_password_id
      parameters:
        - in: path
          name: master_password_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: master_passwords not found
components:
  schemas:

    MasterPasswordsRequest:
      type: object
      required:
        - default_username
        - application
        - secret_ref
      additionalProperties: false
      properties:
        default_username:
          type: string
        application:
          type: string
        secret_ref:
          type: string
        encrypted_password:
          type: string
          nullable: true
        from_domain:
          type: string
          nullable: true
        last_password_updated:
          type: string
          format: date-time
          nullable: true

    MasterPasswordsUpdateRequest:
      type: object
      required:
        - default_username
        - application
        - secret_ref
        - encrypted_password
        - from_domain
        - last_password_updated
      additionalProperties: false
      properties:
        default_username:
          type: string
        application:
          type: string
        secret_ref:
          type: string
        encrypted_password:
          type: string
          nullable: true
        from_domain:
          type: string
          nullable: true
        last_password_updated:
          type: string
          format: date-time
          nullable: true

    MasterPasswordsResponse:
      type: object
      required:
        - master_password_id
        - default_username
        - application
        - secret_ref
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        master_password_id:
          type: string
          format: uuid
          readOnly: true
        default_username:
          type: string
        application:
          type: string
        secret_ref:
          type: string
        encrypted_password:
          type: string
          nullable: true
        from_domain:
          type: string
          nullable: true
        last_password_updated:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
  
