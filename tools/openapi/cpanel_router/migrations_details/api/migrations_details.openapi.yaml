openapi: 3.0.0
x-sql-table: migrations_details
info:
  title: MigrationsDetailsResponse API
  version: 1.0.0
paths:
  /migrations_details:
    get:
      operationId: listMigrationsDetails
      summary: Get all migrations_details
      responses:
        '200':
          description: List of migrations_details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MigrationsDetailsResponse'
    post:
      operationId: createMigrationsDetails
      summary: Create a new migrations_details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationsDetailsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationsDetailsResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /migrations_details/{migration_id}:
    get:
      operationId: getMigrationsDetailsById
      summary: Get migrations_details by migration_id
      parameters:
        - in: path
          name: migration_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
