          description: migrations_details object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationsDetailsResponse'
        '404':
          description: migrations_details not found
    put:
      operationId: updateMigrationsDetails
      summary: Update migrations_details by migration_id
      parameters:
        - in: path
          name: migration_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationsDetailsUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationsDetailsResponse'
        '400':
          description: Invalid request
        '404':
          description: migrations_details not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMigrationsDetails
      summary: Delete migrations_details by migration_id
      parameters:
        - in: path
          name: migration_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: migrations_details not found
