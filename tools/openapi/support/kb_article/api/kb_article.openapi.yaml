      summary: Create a new kb_article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbArticleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbArticleResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /kb_article/{kb_article_id}:
    get:
      operationId: getKbArticleById
      summary: Get kb_article by kb_article_id
      parameters:
        - in: path
          name: kb_article_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: kb_article object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbArticleResponse'
        '404':
          description: kb_article not found
    put:
      operationId: updateKbArticle
      summary: Update kb_article by kb_article_id
      parameters:
        - in: path
          name: kb_article_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbArticleUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbArticleResponse'
        '400':
          description: Invalid request
        '404':
          description: kb_article not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteKbArticle
      summary: Delete kb_article by kb_article_id
      parameters:
        - in: path
          name: kb_article_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: kb_article not found
