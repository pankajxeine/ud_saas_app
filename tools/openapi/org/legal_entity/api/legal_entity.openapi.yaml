        - legal_entity_id
        - legal_entity_code
        - legal_name
        - country_code
        - functional_currency_code
        - registered_address
        - invoice_prefix
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        record_code:
          type: string
          readOnly: true
        legal_entity_id:
          type: string
          format: uuid
          readOnly: true
        legal_entity_code:
          type: string
        legal_name:
          type: string
        country_code:
          type: string
          x-reference:
